[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-zk-stark-prover"
version = "1.0.0"
description = "zk-STARK proof system with FRI polynomial commitment"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "zk-stark", "zero-knowledge", "cryptography", "blockchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-zk-stark-prover"
Repository = "https://github.com/ElNeMeR70/py-zk-stark-prover"
